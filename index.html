<style>
:root{--bg:#f7f1f0;--card:#fff;--text:#2b1517;--muted:#7a6264;--line:#eadcdb;--brand:#701313;--btn:#8a1a1f;--gold:#f0b27a;--bad:#c62828;--note:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#160b0c;--card:#231214;--text:#f4eaea;--muted:#b9a2a3;--line:#3a2326;--btn:#a3232a;--note:#f0b27a;--bad:#ef6a6a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5}
/* lock screen */
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;background:radial-gradient(circle at 50% 0,#8a1c1f 0,var(--brand) 60%);padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 0}
#lock .logo{width:min(200px,58%);height:auto}
#lock h1{font-size:1.45rem;margin:20px 0 2px;letter-spacing:.3px}
#lock .sub{opacity:.8;font-size:.9rem;margin-bottom:18px}
.pinbox{width:100%;max-width:340px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px}
.pinbox input{background:#fff;color:#2b1517;text-align:center;font-size:1.4rem;letter-spacing:.5rem;border:0}
.pinbox button{width:100%;margin-top:10px;background:var(--gold);color:#4a0a0c;font-weight:700}
.err{min-height:1.4em;margin-top:8px;font-weight:600;color:#ffd0c8}
.credit{margin:22px 0 16px;padding:12px 26px;border-top:1px solid rgba(240,178,122,.55);border-bottom:1px solid rgba(240,178,122,.55)}
.credit small{display:block;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.credit b{display:block;margin-top:4px;font:italic 600 1.3rem Georgia,"Times New Roman",serif}
.campus{width:calc(100% + 40px);margin:auto -20px 0;display:block;max-height:32vh;object-fit:cover;object-position:center bottom;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%);mask-image:linear-gradient(to bottom,transparent,#000 28%)}
/* app */
.top{background:var(--brand);color:#fff;border-bottom:3px solid var(--gold);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{height:44px;width:auto;display:block}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;min-width:0;border-radius:0;background:transparent;color:var(--text);font-weight:600}
.seg button.on{background:var(--btn);color:#fff}
.seg button.on.out{background:var(--gold);color:#4a0a0c}
.cam{position:relative;border-radius:12px;overflow:hidden}
#reader [id^="qr-shaded"]{display:none!important}
.frame{display:none;position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.cam.on .frame{display:block}
.frame i{position:absolute;width:46px;height:46px;border:4px solid #fff;transition:border-color .2s}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:36px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:36px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:36px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:36px}
.cam.out .frame i{border-color:var(--gold)}
.cam .frame.ok i{border-color:#4ade80}
.cam .frame.bad i{border-color:#ff6b6b}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:50px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:var(--btn);color:#fff;cursor:pointer;flex:1;min-width:110px}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
#msg{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;z-index:50;padding:12px;border-radius:12px;font-weight:700;text-align:center;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#msg.ok{display:block;background:#1b8a4b}
#msg.bad{display:block;background:#c62828}
.head{display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:.85rem}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li .n{color:var(--muted);min-width:26px}li .d{flex:1;word-break:break-word}
li .nm{font-weight:600}
.grp{display:block;margin-top:12px;padding:8px 10px;border:0;border-radius:8px;background:var(--bg);font-weight:700;font-size:.85rem;word-break:break-all}
.note{color:var(--note);font-size:.85rem;margin-top:2px}
.acts{display:flex;gap:6px;align-self:center}
.ic{flex:none;min-width:0;width:40px;height:40px;padding:0;background:var(--bg);color:var(--text);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:20px;height:20px;display:block;flex:none;fill:none;stroke:currentColor}
.ic.has{color:var(--note);border-color:var(--note)}
.ic.del{color:var(--bad);border-color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.ver{opacity:.65;font-size:.7rem}
.foot{text-align:center;color:var(--muted);font-size:.75rem;padding:8px 0 24px;line-height:1.7}
.foot b{font:italic 600 .9rem Georgia,"Times New Roman",serif;color:var(--text)}
select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(128,128,128,.35);background:transparent;color:inherit;font:inherit}
</style>
</head>
<body>

<div id="lock">
  <img class="logo lg" alt="May University in Cairo">
  <h1>QR Attendance System</h1>
  <div class="sub">Authorized access only</div>
  <div class="pinbox">
    <div id="authForm">
      <input id="em" type="email" autocomplete="email" placeholder="Email" style="letter-spacing:0;font-size:1rem;margin-bottom:8px">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password (min 6 characters)" style="letter-spacing:0;font-size:1rem">
      <div class="err" id="perr"></div>
      <button id="signin">Sign in</button>
      <button id="signup" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)">Create account</button>
    </div>
    <div id="authWait" hidden>
      <div id="wmsg" style="margin-bottom:6px"></div>
      <button id="wref">Check again</button>
      <button id="wresend" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)">Resend verification email</button>
      <button id="wout" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)">Sign out</button>
    </div>
  </div>
  <div class="credit"><small>Concept &amp; Idea</small><b>Dr. Hala Mohamed Ahmed</b></div>
  <div class="ver" style="margin-bottom:10px"></div>
  <img class="campus" id="campusImg" alt="">
</div>

<div id="app" hidden>
  <header class="top"><img class="lg" alt="May University in Cairo"><button id="logout" style="margin-left:auto;flex:none;min-width:0;background:transparent;border:1px solid rgba(255,255,255,.5)">Sign out</button></header>
  <main>
    <div class="card" id="cloudCard" hidden><button id="clRef" class="sec" style="width:100%">History</button><div id="clBody" hidden><div class="muted" id="clHint" style="margin-top:10px"></div><div class="row" style="margin-top:10px"><select id="fLevel" style="flex:1;min-width:0"></select><select id="fGroup" style="flex:1;min-width:0"></select><select id="fSubj" style="flex:1;min-width:0"></select></div><input id="clQ" type="search" dir="auto" placeholder="Search by session name or email" style="margin-top:10px"><ul id="cl"></ul></div></div>
    <div class="card" id="repCard" hidden><button id="repBtn" class="sec" style="width:100%">Attendance report</button><div id="repBody" hidden><select id="repSel" style="margin-top:10px"></select><label>Minimum attendance %</label><input id="repMin" type="number" min="0" max="100" value="75"><div class="muted" id="repSum" style="margin-top:8px"></div><ul id="repList"></ul><button id="repXls" style="width:100%;margin-top:10px">Download Excel</button></div></div>
    <div class="card" id="adminCard" hidden><div class="head"><strong>Users &amp; access</strong><button id="admRef" class="sec" style="flex:none;min-width:0">Refresh</button></div><ul id="reqs"></ul></div>
    <div class="card att">
      <div class="row"><div style="flex:1"><label style="margin-top:0">Level</label><select id="year"><option>First</option><option>Second</option></select></div><div style="flex:1"><label style="margin-top:0">Group</label><select id="group"><option>A</option><option>B</option><option>C</option></select></div></div>
      <label>Subject</label><select id="subject"></select>
      <label>Lecture name</label><input id="lecture" dir="auto" placeholder="e.g. Lecture 3 - The Heart">
      <label>Date</label><input id="date" type="date">
      <label>Students list (Excel or Word)</label><input id="rosterFile" type="file" accept=".xlsx,.xls,.docx">
      <div class="muted" id="rosterInfo" style="margin-top:6px"></div>
    </div>

    <div class="card att">
      <div class="seg"><button id="mIn" class="on">Check In</button><button id="mOut" class="out">Check Out</button></div>
      <div class="cam" id="cam"><div id="reader"></div><div class="frame" id="frame"><i></i><i></i><i></i><i></i></div></div>
      <div class="row" id="zoomRow" hidden><label style="margin:0;flex:none">Zoom</label><input id="zoom" type="range" min="1" max="4" step="0.1" value="1" style="flex:1;padding:0"></div>
      <div class="row"><button id="toggle">Start Camera</button><button id="export" class="sec">Download Excel</button></div>
    </div>

    <div class="card att">
      <div class="head"><strong>Attendance</strong><span style="display:flex;align-items:center;gap:10px"><span class="muted" id="count"></span><button id="addP" class="ic" title="Add a student manually" aria-label="Add a student manually"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button></span></div>
      <div id="manual" hidden style="margin-top:10px"><input id="mId" inputmode="numeric" placeholder="Student ID"><input id="mName" dir="auto" placeholder="Student name" style="margin-top:8px"><div class="row" style="margin-top:8px"><button id="mAdd">Add check-in</button><button id="mCancel" class="sec">Close</button></div></div>
      <div id="stats" style="margin-top:8px;font-weight:600"></div>
      <input id="search" type="search" dir="auto" placeholder="Search by name, ID or note" style="margin-top:10px">
      <ul id="list"></ul>
      <div class="row"><button id="clear" class="danger">Clear Session</button></div>
    </div>

    <div class="foot">
      Concept &amp; Idea<br><b>Dr. Hala Mohamed Ahmed</b><br>
      May University in Cairo<br>© 2026 All rights reserved<br><span class="ver"></span>
    </div>
  </main>
</div>
<div id="msg"></div>

function pickRoster(rows){
  const out=[],seen=new Set();
  rows.forEach(r=>{
    const c=r.map(x=>String(x==null?"":x).replace(/\s+/g," ").trim()).filter(Boolean);
    const id=c.find(x=>/^\d{6,12}$/.test(x));if(!id)return;
    const nm=c.filter(x=>x!==id&&/[A-Za-z\u0600-\u06FF]/.test(x)&&!/\d{3,}/.test(x)).sort((a,b)=>b.length-a.length)[0];
    if(!nm)return;const k=nid(id);if(seen.has(k))return;seen.add(k);out.push({id,name:nm});
  });
  return out;
}

async function readRoster(f){
  const ext=f.name.split(".").pop().toLowerCase(),buf=await f.arrayBuffer();
  if(ext==="doc")throw new Error("Please save the Word file as .docx first");
  if(ext==="docx"){if(typeof mammoth==="undefined")throw new Error("Word reader did not load. Use an Excel file or try again online");const r=await mammoth.convertToHtml({arrayBuffer:buf});return pickRoster(rowsFromHtml(r.value))}
  if(new TextDecoder("utf-8").decode(buf.slice(0,1000)).trimStart().startsWith("<")){
    let r=pickRoster(rowsFromHtml(new TextDecoder("utf-8").decode(buf)));
    if(!r.length)r=pickRoster(rowsFromHtml(new TextDecoder("windows-1256").decode(buf)));
    return r;
  }
  const wb=XLSX.read(buf,{type:"array"});let rows=[];
  wb.SheetNames.forEach(n=>{rows=rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""}))});

}

function onScan(text){

  const p=parse(text);if(!p.id){show("Invalid QR code","bad");return}
  const ex=cur().find(i=>i.id===p.id),nm=(ex&&ex.name)||p.name||rname(p.id)||p.id;
  const bad=m=>{beep(300);if(navigator.vibrate)navigator.vibrate(250);show(m,"bad");flash("bad")};

    if(!ex)return bad(nm+" has not checked in yet");
    if(ex.timeOut)return bad(nm+" already checked out at "+fmtT(ex.timeOut));
    ex.timeOut=new Date().toISOString();
    store(K.items,items);render();beep(700);show("Checked out: "+nm,"ok");flash("ok");return;
  }

}

let repG={};
function repGroups(){

function repCalc(docs,min){
  docs=docs.slice().sort((a,b)=>(a.meta.date||"").localeCompare(b.meta.date||""));
  const ro=(docs.slice().reverse().find(d=>(d.roster||[]).length)||{}).roster||[];
  const sets=docs.map(d=>new Set((d.items||[]).map(i=>nid(i.id))));

}
